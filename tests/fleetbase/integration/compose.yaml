# DISPOSABLE LOCAL TEST ONLY. No host ports, no cloud credentials, no external networks.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set through scripts/run-local-compat.sh}
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.2
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Set through scripts/run-local-compat.sh}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save ''"]
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
  integration:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    environment:
      LOCAL_MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Required}
      LOCAL_REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Required}
      LOCAL_MYSQL_MIGRATOR_PASSWORD: ${LOCAL_MYSQL_MIGRATOR_PASSWORD:?Required}
      LOCAL_MYSQL_RUNTIME_PASSWORD: ${LOCAL_MYSQL_RUNTIME_PASSWORD:?Required}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [isolated]
    command: ["php", "/checks/integration/check.php"]
networks:
  isolated:
    internal: true
